[project]
name = "lmp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pygame>=2.6.1",
    "requests>=2.32.5",
    "fastapi>=0.125.0",
    "pydantic>=2.12.5",
    "uvicorn>=0.38.0",
    "opencv-python>=4.13.0.92",
    "matplotlib>=3.10.9",
    "scipy>=1.15.3",
    "open3d>=0.19.0",
    "pillow>=12.1.0",
    "termcolor>=3.3.0",
    "nicegui>=3.4.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "openai>=2.13.0",
    "google-genai>=1.56.0",
    "python-dotenv>=1.2.1",
    "pybind11>=2.13.6",
    "torch==2.9.1",
    "lang-sam",
    "deva",
    "pyorbbecsdk2",
    "pynput",
    "msgpack>=1.1.2",
]

[tool.uv.sources]
lang-sam = { git = "https://github.com/luca-medeiros/lang-segment-anything.git" }
deva = { path = "src/camera/Tracking-Anything-with-DEVA", editable = true }

[project.scripts]
lmp = "lmp:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
